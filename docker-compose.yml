services:
  drill-hub:
    image: '${DRILL_HUB_IMAGE:-ghcr.io/tzdxf/drill-hub:nightly}'
    restart: unless-stopped
    init: true
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      NODE_ENV: production
      HOST: '${HOST:-0.0.0.0}'
      PORT: '${PORT:-3000}'
      # 默认使用卷内 SQLite；设置 DATABASE_DRIVER=postgres 并启用 postgres profile 切换数据库。
      DATABASE_DRIVER: '${DATABASE_DRIVER:-sqlite}'
      DATABASE_URL: '${DATABASE_URL:-}'
      DATABASE_PATH: /app/data/drill-hub.sqlite
      PUBLIC_URL: '${PUBLIC_URL:-http://localhost:3000}'
      DRILL_HUB_ENCRYPTION_KEY: '${DRILL_HUB_ENCRYPTION_KEY:?请在 .env 中设置 64 位十六进制主密钥}'
      TRUSTED_PROXIES: '${TRUSTED_PROXIES:-}'
      ALLOW_PRIVATE_MODEL_URLS: '${ALLOW_PRIVATE_MODEL_URLS:-false}'
      ACCESS_LOG_RETENTION_DAYS: '${ACCESS_LOG_RETENTION_DAYS:-7}'
      ADMIN_USERNAME: '${ADMIN_USERNAME:-}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
    volumes:
      - drill-hub-data:/app/data

  postgres:
    image: 'postgres:17-alpine'
    profiles: ['postgres']
    restart: unless-stopped
    environment:
      POSTGRES_DB: drill_hub
      POSTGRES_USER: drill_hub
      # 仅在启用 postgres profile 时使用；留空时 postgres 容器会因缺少密码拒绝初始化。
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-}'
    volumes:
      - drill-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drill_hub -d drill_hub']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  drill-hub-data:
  drill-hub-pgdata:
