name: Docker Nightly

on:
  schedule:
    # 04:00 Asia/Shanghai; GitHub schedules use UTC and may be delayed.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-nightly
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare nightly image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          tag="nightly-${date}-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build nightly image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:nightly
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=docker-nightly-amd64
          cache-to: type=gha,mode=max,scope=docker-nightly-amd64

      - name: Test the built image with an isolated database
        env:
          NIGHTLY_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: pnpm test:docker "$NIGHTLY_IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          BUILD_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE:$BUILD_TAG"
          docker push "$IMAGE:nightly"
          {
            echo '## Docker 每日构建'
            echo
            echo "- 本次构建：\`$IMAGE:$BUILD_TAG\`"
            echo "- 滚动标签：\`$IMAGE:nightly\`"
            echo '- 平台：linux/amd64；未发布正式版或 latest 标签。'
          } >> "$GITHUB_STEP_SUMMARY"
